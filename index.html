<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Greek</title>
<meta name="description" content="Type or say English, read and hear it in Greek.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Greek">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-title">Greek</div>
</header>

<main>
  <h1 class="large-title" id="title">Greek</h1>

  <section class="card input-card" id="inputCard">
    <div class="card-head">
      <span class="lang">English</span>
      <button class="text-btn" id="done" hidden>Done</button>
      <button class="clear-btn" id="clear" aria-label="Clear text" hidden>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>
      </button>
    </div>
    <textarea id="input" rows="2" placeholder="Enter text" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
    <div class="card-foot">
      <button class="round-btn" id="mic" aria-label="Speak English">
        <svg viewBox="0 0 24 24"><rect class="f" x="8.75" y="2.5" width="6.5" height="12" rx="3.25"/><path d="M5.75 11a6.25 6.25 0 0 0 12.5 0M12 17.25v3.5"/></svg>
      </button>
      <button class="pill-btn" id="paste">
        <svg viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="13" height="16.5" rx="2.75"/><rect class="f" x="8.75" y="2.75" width="6.5" height="3.75" rx="1.4"/></svg>
        Paste
      </button>
      <span class="listening" id="listening" hidden><i></i><i></i><i></i><i></i><i></i>Listening</span>
      <span class="count" id="count"></span>
    </div>
  </section>

  <section class="output" id="output" hidden>
    <div class="out-head">
      <span class="lang">Greek</span>
      <span class="spinner" id="spinner" hidden></span>
      <span class="hint" id="hint">Tap a word to hear it</span>
    </div>
    <div class="lines" id="lines"></div>
    <p class="error" id="error" hidden></p>
  </section>
</main>

<div class="edge-bottom" aria-hidden="true"></div>

<div class="toolbar" id="toolbar" hidden>
  <button class="glass circle speed" id="speed" aria-label="Playback speed">1×</button>
  <button class="glass prominent" id="play">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M7.5 5.1v13.8c0 .8.9 1.3 1.6.9l11-6.9c.6-.4.6-1.3 0-1.7l-11-6.9c-.7-.5-1.6 0-1.6.8z"/></svg>
    <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    <span>Play</span>
  </button>
  <button class="glass circle" id="copy" aria-label="Copy pronunciation">
    <svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="12.5" rx="2.5"/><path d="M15.5 5.5V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h.5"/></svg>
  </button>
</div>

<div class="hud" id="hud" aria-live="polite">
  <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <span id="hudText">Copied</span>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
