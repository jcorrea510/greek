<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greek</title>
<meta name="description" content="Type or say English. Read it out loud in Greek and hear a native voice.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Greek">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect fill="currentColor" stroke="none" x="8.6" y="2.4" width="6.8" height="12.2" rx="3.4"/><path d="M5.6 11a6.4 6.4 0 0 0 12.8 0M12 17.4v3.4"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24"><rect x="5.4" y="4.4" width="13.2" height="16.8" rx="2.8"/><rect fill="currentColor" stroke="none" x="8.7" y="2.6" width="6.6" height="3.9" rx="1.4"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><circle fill="currentColor" stroke="none" cx="12" cy="12" r="10"/><path stroke="#1c1c1e" stroke-width="2.3" d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7.2 4.9v14.2c0 .9 1 1.4 1.7.9l11.2-7.1c.7-.4.7-1.4 0-1.8L8.9 4c-.7-.5-1.7 0-1.7.9z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect fill="currentColor" stroke="none" x="5.8" y="5.8" width="12.4" height="12.4" rx="2.6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.4" y="8.4" width="11.6" height="12.6" rx="2.6"/><path d="M15.6 5.4V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h.4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.7l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M3.4 9.2v5.6c0 .6.4 1 1 1h2.7l4.2 3.6c.6.6 1.7.1 1.7-.8V5.4c0-.9-1-1.4-1.7-.8L7.1 8.2H4.4c-.6 0-1 .4-1 1z"/><path d="M16.4 8.7a4.7 4.7 0 0 1 0 6.6M19.2 5.9a8.6 8.6 0 0 1 0 12.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19 7.4"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.6 13.3a5 5 0 0 1 6.1-.6M5.2 10a9.6 9.6 0 0 1 4-2.3M12 6.9c2.9 0 5.5 1.1 7.5 3M12 18.6h.01"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.6 12a7.4 7.4 0 1 0 2.2-5.3M4.6 3.8v4.6h4.6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
</svg>

<div class="app" id="app">
  <div class="top-edge" aria-hidden="true"></div>

  <main class="scroll" id="scroll">
    <h1 class="title">Greek</h1>

    <section class="card input-card" id="inputCard">
      <div class="card-head">
        <span class="lang">English</span>
        <button class="icon-btn clear" id="clear" aria-label="Clear text" hidden><svg><use href="#i-clear"/></svg></button>
      </div>
      <textarea id="input" rows="1" placeholder="Enter text" autocomplete="off" autocapitalize="sentences" spellcheck="true" enterkeyhint="done" aria-label="English text"></textarea>
      <div class="input-tools">
        <button class="tool round" id="mic" aria-label="Speak English"><svg><use href="#i-mic"/></svg></button>
        <span class="listening" id="listening" hidden><i></i><i></i><i></i><i></i><i></i><span>Listening…</span></span>
        <button class="tool pill" id="paste"><svg><use href="#i-paste"/></svg><span>Paste</span></button>
        <span class="count" id="count"></span>
        <button class="done" id="done" hidden>Done</button>
      </div>
    </section>

    <section class="card result-card" id="result" hidden aria-live="polite">
      <div class="card-head">
        <span class="lang">Greek</span>
        <div class="seg register" id="register" role="radiogroup" aria-label="Formality" hidden>
          <span class="thumb" aria-hidden="true"></span>
          <button role="radio" data-value="casual" aria-checked="true">Casual</button>
          <button role="radio" data-value="formal" aria-checked="false">Formal</button>
        </div>
      </div>
      <div class="lines" id="lines"></div>
      <div class="state" id="state" hidden></div>
      <div class="result-foot" id="resultFoot">
        <button class="icon-btn" id="save" aria-label="Save phrase" aria-pressed="false"><svg><use href="#i-star"/></svg></button>
        <button class="icon-btn" id="copy" aria-label="Copy"><svg><use href="#i-copy"/></svg></button>
        <span class="hint" id="hint">Tap any word to hear it</span>
      </div>
    </section>

    <section class="home" id="home">
      <div class="group" id="suggest">
        <h2 class="group-title">Try</h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="group" id="savedGroup" hidden>
        <h2 class="group-title">Saved</h2>
        <ul class="list" id="savedList"></ul>
      </div>
      <div class="group" id="recentGroup" hidden>
        <h2 class="group-title">Recent <button class="text-btn" id="clearRecent">Clear</button></h2>
        <ul class="list" id="recentList"></ul>
      </div>
    </section>
  </main>

  <footer class="dock" id="dock" hidden>
    <div class="seg speed" id="speed" role="radiogroup" aria-label="Speech speed">
      <span class="thumb" aria-hidden="true"></span>
      <button role="radio" data-value="normal" aria-checked="true">1×</button>
      <button role="radio" data-value="slow" aria-checked="false">0.5×</button>
    </div>
    <button class="play" id="play">
      <span class="play-progress" id="progress" aria-hidden="true"></span>
      <svg class="i-play"><use href="#i-play"/></svg><svg class="i-stop"><use href="#i-stop"/></svg>
      <span class="play-label">Play</span>
    </button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"><svg><use href="#i-check"/></svg><span id="toastText"></span></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
